name: SafeGuard AI Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          pip install numpy opencv-python-headless pyyaml

      - name: Run full test suite
        # Runs all four test files:
        #   test_core.py            — 41 unit tests, always runs (no models/videos needed)
        #   test_id_relinker.py     — 9 IDRelinker unit tests, always runs (pure Python)
        #   test_dwell_accumulation.py — integration test, SKIPPED in CI because
        #                               test_proximity.mp4 (~11 MB) is not committed to
        #                               the repository (large binary). Run locally with the
        #                               video file present. Skips are shown in CI output,
        #                               NOT silently omitted.
        run: |
          pytest tests/ -v --tb=short \
            --cov=modules --cov-report=term-missing \
            --ignore=tests/test_app.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
